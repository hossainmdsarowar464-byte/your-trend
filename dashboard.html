<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YOUR TREND - Dashboard</title>

  <link rel="stylesheet" href="style.css">
<style>

/* ===== YOUR TREND DASHBOARD ===== */

body {
  margin: 0;
  background: #f8fafc;
  font-family: Arial, sans-serif;
  color: #0f172a;
}

header {
  background: #0f172a;
  color: white;
  padding: 18px 20px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 4px 0 0;
  color: #cbd5e1;
  font-size: 13px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 18px;
}

main > h2 {
  margin: 0 0 20px;
  font-size: 24px;
}

.dashboard-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.card {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 18px;
}

.card h3 {
  margin: 0 0 12px;
  font-size: 14px;
  color: #64748b;
  font-weight: normal;
}

.card strong {
  font-size: 28px;
  display: block;
}

.card p {
  margin: 7px 0 0;
  font-size: 12px;
  color: #94a3b8;
}

.dashboard-section {
  margin-top: 25px;
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 20px;
}

.dashboard-section h2 {
  margin-top: 0;
  font-size: 18px;
}

.dashboard-section p {
  color: #64748b;
  font-size: 14px;
}

/* ===== MOBILE ===== */

@media (max-width: 700px) {

  .dashboard-cards {
    grid-template-columns: repeat(2, 1fr);
  }

  main {
    padding: 20px 14px;
  }

}

  </style>
</head>

<body>

  <header class="dashboard-header">

    <div>
      <h1>YOUR TREND</h1>
      <p>Admin Dashboard</p>
    </div>

    <a href="admin.html" class="admin-btn">
      ← Admin Panel
    </a>

  </header>


  <main>

    <div class="dashboard-title">
      <div>
        <h2>Dashboard</h2>
        <p>Welcome to your store overview.</p>
      </div>
    </div>


    <!-- SUMMARY -->

    <section class="dashboard-cards">

      <div class="card">
        <span>Visitors</span>
        <strong id="totalVisitors">0</strong>
        <small>Today</small>
      </div>


      <div class="card">
        <span>Orders</span>
        <strong id="totalOrders">0</strong>
        <small>Today</small>
      </div>


      <div class="card">
        <span>Products</span>
        <strong id="totalProducts">0</strong>
        <small>Total</small>
      </div>


      <div class="card">
        <span>Sales</span>
        <strong id="totalSales">৳0</strong>
        <small>Today</small>
      </div>

    </section>


    <!-- RECENT ORDERS -->

    <section class="dashboard-section">

      <div class="section-heading">
        <h2>Recent Orders</h2>
        <span>Latest orders</span>
      </div>

      <div id="recentOrders">
        <p class="empty-message">
          No orders yet.
        </p>
      </div>

    </section>


  </main>
<script type="module" src="dashboard.js?v=2"></script>
</body>

</html>
