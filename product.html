<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YOUR TREND - Product Details</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="hero">

  <h1>YOUR TREND</h1>

  <p>🛍️ Product Details</p>

</header>


<section class="product-details">

  <img
  id="productImage"
  class="product-details-image"
  src=""
  alt="Product"
  style="width:350px; max-width:100%; height:350px; object-fit:contain; display:block; margin:0 auto 20px;"
>


  <h2 id="productName"></h2>


  <h3>
    ৳<span id="productPrice"></span>
  </h3>


  <p id="productDescription"></p>


  <button
    class="btn"
    onclick="addSelectedProduct()"
  >
    🛒 Add to Cart
  </button>


  <button
    class="btn"
    onclick="goCheckout()"
  >
    📦 Checkout
  </button>


  <hr>

<div class="order-form">

  <h2>📦 অর্ডার ফর্ম</h2>

  <!-- Name -->

  <div class="form-group">

    <label for="name">
      👤 নাম
    </label>

    <div class="input-box">

      <span>👤</span>

      <input
        id="name"
        type="text"
        placeholder="আপনার নাম লিখুন"
      >

    </div>

  </div>


  <!-- Phone -->

  <div class="form-group">

    <label for="phone">
      📱 মোবাইল নম্বর
    </label>

    <div class="input-box">

      <span>📞</span>

      <input
        id="phone"
        type="tel"
        placeholder="01XXXXXXXXX"
      >

    </div>

  </div>


  <!-- Delivery Area -->

  <div class="form-group">

    <label for="deliveryArea">
      🚚 Delivery Area
    </label>

    <div class="input-box">

      <span>🚚</span>

      <select id="deliveryArea">

        <option value="70">
          ঢাকার ভিতরে — ৳70
        </option>

        <option value="100">
          সাব ঢাকা — ৳100
        </option>

        <option value="120">
          ঢাকার বাইরে — ৳120
        </option>

      </select>

    </div>

  </div>


  <!-- Payment -->

  <div class="form-group">

    <label>
      💵 Payment Method
    </label>

    <div class="payment-box">

      💵 Cash on Delivery

    </div>

  </div>


  <!-- Address -->

  <div class="form-group">

    <label for="address">
      📍 ঠিকানা
    </label>

    <div class="textarea-box">

      <span>📍</span>

      <textarea
        id="address"
        placeholder="সম্পূর্ণ ঠিকানা লিখুন"
      ></textarea>

    </div>

  </div>


  <!-- WhatsApp -->

  <button
    class="btn whatsapp-order-btn"
    onclick="orderSelectedProduct()"
  >
    📲 WhatsApp-এ অর্ডার করুন
  </button>


  <p id="msg"></p>

</div>

</section>


<script src="./product.js?v=2"></script>

</body>

</html>
