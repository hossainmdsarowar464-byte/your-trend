<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YOUR TREND - Product Details</title>

  <link rel="stylesheet" href="style.css">


  <style>

    .product-option-box {
      margin-top: 20px;
      padding: 15px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #ddd;
    }


    .option-title {
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 7px;
    }


    .quantity-control {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 7px;
    }


    .quantity-control button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 8px;
      background: #ff6b00;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }


    .quantity-number {
      min-width: 35px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }


    .size-select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

  </style>

</head>


<body>


<header class="hero">

  <h1>YOUR TREND</h1>

  <p>🛍️ Product Details</p>

</header>


<section class="product-details">


  <img id="productImage" class="product-details-image" src="">

<div id="imageGallery" style="display:flex;gap:8px;overflow-x:auto;margin:10px 0;"></div>


  <h2 id="productName"></h2>


  <h3>
    ৳<span id="productPrice"></span>
  </h3>


  <p id="productDescription"></p>


  <!-- Product Quantity + Size -->

  <div class="product-option-box">


    <div class="option-title">

      🔢 কত পিস নেবেন?

    </div>


    <div class="quantity-control">


      <button
        type="button"
        onclick="decreaseProductQuantity()"
      >
        −
      </button>


      <span
        id="productQuantity"
        class="quantity-number"
      >
        1
      </span>


      <button
        type="button"
        onclick="increaseProductQuantity()"
      >
        +
      </button>


    </div>


    <div class="option-title">

      📏 Size নির্বাচন করুন

    </div>


    <select
      id="productSize"
      class="size-select"
    >

      <option value="">
        Size নির্বাচন করুন
      </option>

      <option value="S">
        S
      </option>

      <option value="M">
        M
      </option>

      <option value="L">
        L
      </option>

      <option value="XL">
        XL
      </option>

      <option value="XXL">
        XXL
      </option>

      <option value="প্রযোজ্য নয়">
        প্রযোজ্য নয়
      </option>

    </select>


  </div>


  <button
    class="btn"
    onclick="addSelectedProduct()"
  >
    🛒 Add to Cart
  </button>


  <button
    class="btn"
    onclick="goCheckout()"
  >
    📦 Checkout
  </button>


  <hr>


  <div class="order-form">


    <h2>📦 অর্ডার ফর্ম</h2>


    <!-- Name -->

    <div class="form-group">

      <label for="name">
        👤 নাম
      </label>


      <div class="input-box">

        <span>👤</span>

        <input
          id="name"
          type="text"
          placeholder="আপনার নাম লিখুন"
        >

      </div>

    </div>


    <!-- Phone -->

    <div class="form-group">

      <label for="phone">
        📱 মোবাইল নম্বর
      </label>


      <div class="input-box">

        <span>📞</span>

        <input
          id="phone"
          type="tel"
          placeholder="01XXXXXXXXX"
        >

      </div>

    </div>


    <!-- Delivery Area -->

    <div class="form-group">

      <label for="deliveryArea">
        🚚 Delivery Area
      </label>


      <div class="input-box">

        <span>🚚</span>


        <select id="deliveryArea">

          <option value="70">
            ঢাকার ভিতরে — ৳70
          </option>

          <option value="100">
            সাব ঢাকা — ৳100
          </option>

          <option value="120">
            ঢাকার বাইরে — ৳120
          </option>

        </select>

      </div>

    </div>


    <!-- Payment -->

    <div class="form-group">

      <label>
        💵 Payment Method
      </label>


      <div class="payment-box">

        💵 Cash on Delivery

      </div>

    </div>

<!-- District -->
<div class="form-group">
  <label>🏙️ জেলা</label>
  <div class="input-box">
    <span>🏙️</span>
    <select id="district">
      <option value="">জেলা নির্বাচন করুন</option>
    </select>
  </div>
</div>

<!-- Upazila -->
<div class="form-group">
  <label>📍 উপজেলা</label>
  <div class="input-box">
    <span>📍</span>
    <select id="upazila">
      <option value="">উপজেলা নির্বাচন করুন</option>
    </select>
  </div>
</div>
    <!-- Address -->

    <div class="form-group">

      <label for="address">
        📍 ঠিকানা
      </label>


      <div class="textarea-box">

        <span>📍</span>


        <textarea
          id="address"
          placeholder="সম্পূর্ণ ঠিকানা লিখুন"
        ></textarea>

      </div>

    </div>


    <!-- WhatsApp -->

    <button
      class="btn whatsapp-order-btn"
      onclick="orderSelectedProduct()"
    >
      📲 WhatsApp-এ অর্ডার করুন
    </button>


    <p id="msg"></p>


  </div>


</section>


<script src="./product.js?v=3"></script>


</body>

</html>
