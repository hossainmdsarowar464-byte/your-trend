<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YOUR TREND - Admin</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 20px;
    }

    .admin-box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #ff6b00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #logoutBtn {
      background: #d32f2f;
    }

    #selectImageBtn {
      background: #1976d2;
    }

    #imagePreview {
      display: none;
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    #imageStatus {
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
      line-height: 1.5;
    }

    .hint {
      font-size: 13px;
      color: #666;
      margin-top: 5px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #333;
      text-decoration: none;
    }

  </style>

</head>


<body>

  <div class="admin-box">

    <h1>🛍️ YOUR TREND Admin</h1>


    <!-- Logout -->

    <button id="logoutBtn">
      🚪 Logout
    </button>


    <!-- Product Name -->

    <label>
      Product Name
    </label>

    <input
      type="text"
      id="productName"
      placeholder="যেমন: Premium T-Shirt"
    >


    <!-- Price -->

    <label>
      Price
    </label>

    <input
      type="number"
      id="productPrice"
      placeholder="যেমন: 490"
    >


    <!-- Product Image -->

    <label>
      Product Image
    </label>

    <button
      type="button"
      id="selectImageBtn"
    >
      📷 Select Product Image
    </button>

    <p id="imageStatus">
      কোনো ছবি নির্বাচন করা হয়নি
    </p>

    <img
      id="imagePreview"
      alt="Product Preview"
    >


    <!-- Category -->

    <label>
      Category
    </label>

    <select id="productCategory">

      <option value="fashion">
        Fashion
      </option>

      <option value="gadgets">
        Gadgets
      </option>

      <option value="bags">
        Bags
      </option>

    </select>


    <!-- Stock -->

    <label>
      📦 Stock Quantity
    </label>

    <input
      type="number"
      id="productStock"
      min="0"
      value="0"
      placeholder="যেমন: 20"
    >

    <p class="hint">
      এই Product-এর মোট কতটি পণ্য আছে তা লিখুন।
    </p>


    <!-- Sizes -->

    <label>
      📏 Available Sizes
    </label>

    <input
      type="text"
      id="productSizes"
      placeholder="যেমন: S, M, L, XL"
    >

    <p class="hint">
      একাধিক Size হলে কমা দিয়ে লিখুন। যেমন: S, M, L, XL
    </p>


    <!-- Description -->

    <label>
      Description
    </label>

    <textarea
      id="productDescription"
      placeholder="Product details লিখুন..."
    ></textarea>


    <!-- Save -->

    <button id="saveProductBtn">
      ➕ Add Product
    </button>


    <p id="message"></p>


    <a
      href="index.html"
      class="back"
    >
      ← Back to Website
    </a>

  </div>


  <!-- Cloudinary Upload Widget -->

  <script src="https://upload-widget.cloudinary.com/latest/global/all.js"></script>


  <!-- YOUR TREND Admin JavaScript -->

  <script
    type="module"
    src="admin.js"
  ></script>


</body>

</html>
