<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YOUR TREND - Admin</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 20px;
    }

    .admin-box {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 30px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #ff6b00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #logoutBtn {
      background: #d32f2f;
    }

    #selectImageBtn {
      background: #1976d2;
    }

    #cancelEditBtn {
      background: #777;
    }

    #imagePreview {
      display: none;
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    #imageStatus {
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #333;
      text-decoration: none;
    }

    /* PRODUCT LIST */

    .product-list {
      margin-top: 15px;
    }

    .product-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: #f8f8f8;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .product-item img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .product-info {
      flex: 1;
    }

    .product-info b {
      display: block;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .product-info span {
      display: block;
      font-size: 14px;
      color: #555;
      margin-top: 3px;
    }

    .edit-btn {
      width: auto;
      margin: 0;
      padding: 9px 14px;
      background: #1976d2;
      font-size: 14px;
    }

    .section-title {
      border-top: 1px solid #ddd;
      padding-top: 20px;
    }

    #editMode {
      display: none;
      background: #fff8e1;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
    }

  </style>

</head>

<body>

<div class="admin-box">

  <h1>🛍️ YOUR TREND Admin</h1>

  <button id="logoutBtn">
    🚪 Logout
  </button>


  <!-- PRODUCT LIST -->

  <h2>📦 Your Products</h2>

  <div id="productList" class="product-list">
    ⏳ Products loading...
  </div>


  <!-- ADD / EDIT FORM -->

  <h2 class="section-title">
    ➕ Add / ✏️ Edit Product
  </h2>

  <div id="editMode">
    ✏️ আপনি এখন Product Edit করছেন
  </div>


  <label>Product Name</label>

  <input
    type="text"
    id="productName"
    placeholder="যেমন: Premium T-Shirt"
  >


  <label>Price</label>

  <input
    type="number"
    id="productPrice"
    placeholder="যেমন: 490"
  >


  <label>Stock</label>

  <input
    type="number"
    id="productStock"
    min="0"
    placeholder="যেমন: 10"
  >


  <label>Product Image</label>

  <button
    type="button"
    id="selectImageBtn"
  >
    📷 Select Product Image
  </button>

  <p id="imageStatus">
    আগের ছবি ব্যবহার করা হবে
  </p>

  <img
    id="imagePreview"
    alt="Product Preview"
  >


  <label>Category</label>

  <select id="productCategory">

    <option value="fashion">
      Fashion
    </option>

    <option value="gadgets">
      Gadgets
    </option>

    <option value="bags">
      Bags
    </option>

  </select>


  <label>Description</label>

  <textarea
    id="productDescription"
    placeholder="Product details লিখুন..."
  ></textarea>


  <button id="saveProductBtn">
    ➕ Add Product
  </button>


  <button
    id="cancelEditBtn"
    style="display:none;"
  >
    ❌ Cancel Edit
  </button>


  <p id="message"></p>

  <a
    href="index.html"
    class="back"
  >
    ← Back to Website
  </a>

</div>


<script src="https://upload-widget.cloudinary.com/latest/global/all.js"></script>

<script type="module" src="admin.js?v=3"></script>

</body>

</html>
