<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUR TREND</title>
<link rel="stylesheet" href="style.css">
</head><body><img src="banner.png" alt="YOUR TREND Banner" style="width:100%;display:block;">

<header class="hero">  <div class="search-box">
    <div class="cats">
      <button>👕 Fashion</button>
      <button>⌚ Gadgets</button>
      <button>🎒 Bags</button>
      <button>🔥 New</button>
    </div><input type="text" placeholder="Search products...">

  </div>  <h1>YOUR TREND</h1>
  <p>Trusted Fashion & Gadget Store</p>  <div class="cart">
    🛒 <span id="count">0</span>
  </div></header><img src="images/1783948832_L_1.jpeg" style="width:300px;"><section style="padding:20px;text-align:center">
  <h2>🔥 Trending Collection</h2>
  <p>Fashion • Gadgets • Lifestyle</p>
</section><div id="products" class="grid"></div><section class="checkout">
  <h2>Checkout</h2>  <input id="name" placeholder="আপনার নাম">
  <input id="phone" placeholder="ফোন নম্বর">  <textarea id="address"
  placeholder="সম্পূর্ণ ঠিকানা"></textarea><button onclick="placeOrder()">অর্ডার করুন</button>

  <p id="msg"></p>
</section><script src="script.js"></script></body>
</html>
