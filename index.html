<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUR TREND</title>
<link rel="stylesheet" href="style.css">
</head><body><img src="file_0000000005cc820898bb1cafb31d2296.png" alt="YOUR TREND Banner" style="width:100%;display:block;">

<header class="hero">  <div class="search-box">
    <div class="cats">
      <button onclick="filterCategory('fashion')">👕 Fashion</button>
<button onclick="filterCategory('gadgets')">⌚ Gadgets</button>
<button onclick="filterCategory('bags')">🎒 Bags</button>
<button onclick="filterCategory('all')">🔥 All</button>
    </div><input type="text" id="search" placeholder="Search products...">

  </div>  <h1>YOUR TREND</h1>
  <p>Trusted Fashion & Gadget Store</p>  <div class="cart" onclick="openCart()">
  🛒 <span id="count">0</span>
</div>

<div id="cartBox" class="cart-box">
  <h2>🛒 Your Cart</h2>
  <div id="cartItems"></div>
  <h3>Total: ৳<span id="total">0</span></h3>

<button class="btn" onclick="goCheckout()">
  🛍️ Checkout / Order Now
</button>

<button class="btn" onclick="closeCart()" style="margin-top:8px;">
  Close
</button>
</div>
  </div></header><img src="images/1783948832_L_1.jpeg" style="width:300px;"><section style="padding:20px;text-align:center">
  <h2>🔥 Trending Collection</h2>
  <p>Fashion • Gadgets • Lifestyle</p>
</section><div id="products" class="grid"></div><section class="checkout">
  <h2>Checkout</h2> <div id="orderSummary" class="order-summary">
  <h3>🛍️ Order Summary</h3>
  <div id="checkoutItems"></div>
  <p class="checkout-total">
    মোট: ৳<span id="checkoutTotal">0</span>
  </p>
  </div> <input id="name" placeholder="আপনার নাম">
  <input id="phone" placeholder="ফোন নম্বর">  <textarea id="address"
  placeholder="সম্পূর্ণ ঠিকানা"></textarea><button onclick="placeOrder()">অর্ডার করুন</button>

  <p id="msg"></p>
</section><script src="script.js"></script></body>
</html>
